; B-16 fix: there was no root pytest configuration, so `@pytest.mark.asyncio`
; raised PytestUnknownMarkWarning and the decorated coroutines were collected
; but NEVER AWAITED — they reported "passed" without executing a single
; assertion. `asyncio_mode = auto` makes pytest-asyncio run them for real.
[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    asyncio: run the test in an event loop (pytest-asyncio)
    integration: requires a live upstream; skipped by default in CI
